# Publish archivefs to PyPI via trusted publishing (OIDC — no API token).
#
# ARMED: a published GitHub Release triggers a build + upload via trusted publishing.
# The upload requires the PyPI side configured first (else the publish job fails at
# the OIDC exchange with `invalid-publisher`): a pending publisher
# (owner swarbricklab / repo archivefs / workflow publish.yml / environment pypi)
# and a `pypi` GitHub environment. See docs/releasing.md for the full walkthrough.
#
# The version comes from the git tag via setuptools-scm, so the build must run from
# the tagged commit. `fetch-depth: 0` lets setuptools-scm see tags, and the build
# checkout pins `ref` to the release tag so the version is derived from exactly that
# tag (not a post-release dev version). `workflow_dispatch` stays for manual re-runs.

name: publish

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact tag on a release (setuptools-scm reads it); fall back to
          # the dispatched ref for a manual workflow_dispatch run.
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist .
      - name: Check the distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
